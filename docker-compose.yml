version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: elux-postgres
    environment:
      POSTGRES_DB: elux_products
      POSTGRES_USER: elux_user
      POSTGRES_PASSWORD: elux_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elux_user -d elux_products"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: elux-product-api
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/elux_products
      DATABASE_USER: elux_user
      DATABASE_PASSWORD: elux_pass
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
