ktor {
    deployment {
        port = 8080
        port = ${?PORT}
    }
    application {
        modules = [ com.elux.ApplicationKt.module ]
    }
}

database {
    jdbcUrl = "jdbc:postgresql://localhost:5432/elux_products"
    jdbcUrl = ${?DATABASE_URL}
    driver = "org.postgresql.Driver"
    user = "elux_user"
    user = ${?DATABASE_USER}
    password = "elux_pass"
    password = ${?DATABASE_PASSWORD}
    maxPoolSize = 10
}
